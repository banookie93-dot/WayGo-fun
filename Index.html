<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayGo — Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Mystická žiara v pozadí */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(
                circle,
                rgba(255, 55, 0, 0.20),
                rgba(255, 90, 0, 0.08) 35%,
                transparent 70%
            );
            filter: blur(40px);
            animation: pulse 4s ease-in-out infinite;
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 2;
        }

        .logo {
            font-size: clamp(4rem, 15vw, 9rem);
            font-weight: 900;
            letter-spacing: -7px;

            background: linear-gradient(
                120deg,
                #ff2a00,
                #ff5a00,
                #ff9d00,
                #ff2400,
                #ff5a00
            );

            background-size: 300% 300%;

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow:
                0 0 15px rgba(255, 60, 0, 0.5),
                0 0 50px rgba(255, 50, 0, 0.25);

            animation:
                gradient 5s ease infinite,
                glow 3s ease-in-out infinite;
        }

        .coming {
            margin-top: 15px;
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            letter-spacing: 0.65em;
            color: #777;
            text-transform: uppercase;

            animation: appear 2s ease forwards;
        }

        .line {
            width: 90px;
            height: 2px;
            margin: 25px auto 0;

            background: linear-gradient(
                90deg,
                transparent,
                #ff3b00,
                #ff8c00,
                transparent
            );

            box-shadow: 0 0 15px #ff3b00;

            animation: linePulse 2s ease-in-out infinite;
        }

        /* malé svetielka */
        .spark {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ff5a00;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3b00;
            animation: float 5s infinite ease-in-out;
        }

        .s1 { top: 20%; left: 20%; animation-delay: 0s; }
        .s2 { top: 70%; left: 15%; animation-delay: 1s; }
        .s3 { top: 25%; right: 20%; animation-delay: 2s; }
        .s4 { top: 75%; right: 18%; animation-delay: 3s; }
        .s5 { top: 15%; left: 50%; animation-delay: 1.5s; }

        @keyframes gradient {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes glow {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.35);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @keyframes linePulse {
            0%, 100% {
                opacity: 0.4;
                transform: scaleX(0.7);
            }
            50% {
                opacity: 1;
                transform: scaleX(1.2);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.2;
            }
            50% {
                transform: translateY(-40px) scale(1.8);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="spark s1"></div>
    <div class="spark s2"></div>
    <div class="spark s3"></div>
    <div class="spark s4"></div>
    <div class="spark s5"></div>

    <main class="container">
        <div class="logo">WayGo</div>

        <div class="coming">
            Coming Soon
        </div>

        <div class="line"></div>
    </main>

</body>
</html>
