<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayGo — Coming Soon</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030303;
      font-family: 'Orbitron', sans-serif;
      color: white;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* DARK BACKGROUND */
    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 45, 0, 0.12), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(255, 0, 0, 0.10), transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(255, 100, 0, 0.08), transparent 25%),
        #030303;
      z-index: -5;
    }

    /* MOVING LIGHT */
    .orb {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 55, 0, 0.18),
        rgba(255, 0, 0, 0.04),
        transparent 70%
      );
      filter: blur(30px);
      animation: moveOrb 9s ease-in-out infinite alternate;
      z-index: -3;
    }

    @keyframes moveOrb {
      0% {
        transform: translate(-30vw, -20vh) scale(.8);
      }
      50% {
        transform: translate(20vw, 20vh) scale(1.2);
      }
      100% {
        transform: translate(-5vw, 35vh) scale(.9);
      }
    }

    /* GLOW LINES */
    .line {
      position: fixed;
      width: 150vw;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        #ff2200,
        #ff6a00,
        transparent
      );
      opacity: .25;
      filter: blur(2px);
      transform: rotate(-25deg);
      animation: lineMove 7s linear infinite;
    }

    .line:nth-child(2) {
      animation-delay: -3s;
      opacity: .15;
      transform: rotate(25deg);
    }

    @keyframes lineMove {
      from {
        left: -100%;
      }
      to {
        left: 100%;
      }
    }

    /* PARTICLES */
    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #ff4d00;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff3300;
      animation: float linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(110vh);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      80% {
        opacity: .8;
      }

      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* MAIN */
    .container {
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 30px;
    }

    .logo {
      font-size: clamp(45px, 9vw, 110px);
      font-weight: 900;
      letter-spacing: 12px;
      margin-bottom: 15px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #ff4d00,
        #ff1600,
        #ffffff
      );

      background-size: 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation:
        gradient 4s linear infinite,
        logoPulse 2.5s ease-in-out infinite;
    }

    @keyframes gradient {
      0% { background-position: 0%; }
      100% { background-position: 300%; }
    }

    @keyframes logoPulse {
      0%, 100% {
        filter: drop-shadow(0 0 5px rgba(255,40,0,.3));
      }

      50% {
        filter: drop-shadow(0 0 25px rgba(255,40,0,.8));
      }
    }

    .subtitle {
      color: #777;
      font-size: 11px;
      letter-spacing: 7px;
      margin-bottom: 55px;
      text-transform: uppercase;
    }

    /* COMING SOON */
    .coming {
      font-size: clamp(35px, 7vw, 85px);
      font-weight: 900;
      letter-spacing: 8px;
      color: #fff;

      text-shadow:
        0 0 10px rgba(255, 40, 0, .8),
        0 0 35px rgba(255, 40, 0, .5),
        0 0 80px rgba(255, 40, 0, .25);

      animation: breathe 2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: .85;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    .message {
      margin-top: 25px;
      color: #aaa;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
    }

    /* BUTTON */
    .sound {
      margin-top: 40px;
      padding: 13px 25px;
      border: 1px solid rgba(255, 70, 0, .5);
      background: rgba(255, 30, 0, .05);
      color: #ff5a00;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 3px;
      cursor: pointer;
      transition: .3s;
      backdrop-filter: blur(10px);
    }

    .sound:hover {
      background: rgba(255, 50, 0, .15);
      box-shadow:
        0 0 20px rgba(255, 50, 0, .4),
        inset 0 0 20px rgba(255, 50, 0, .05);
      transform: scale(1.05);
    }

    /* GLITCH */
    .glitch {
      position: relative;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      overflow: hidden;
      opacity: .7;
    }

    .glitch::before {
      color: #ff0000;
      transform: translate(2px, 0);
      clip-path: inset(0 0 60% 0);
      animation: glitch1 2.5s infinite;
    }

    .glitch::after {
      color: #ff7300;
      transform: translate(-2px, 0);
      clip-path: inset(60% 0 0 0);
      animation: glitch2 2s infinite;
    }

    @keyframes glitch1 {
      0%, 90%, 100% { transform: translate(2px, 0); }
      92% { transform: translate(-7px, 2px); }
      94% { transform: translate(5px, -2px); }
    }

    @keyframes glitch2 {
      0%, 85%, 100% { transform: translate(-2px, 0); }
      87% { transform: translate(8px, -2px); }
      89% { transform: translate(-5px, 2px); }
    }

    /* VIGNETTE */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle,
        transparent 35%,
        rgba(0,0,0,.45) 75%,
        #000 120%
      );
      z-index: 5;
    }

    /* SCANLINES */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.015) 0px,
        rgba(255,255,255,.015) 1px,
        transparent 1px,
        transparent 4px
      );
      z-index: 20;
    }

    @media(max-width:600px) {
      .logo {
        letter-spacing: 6px;
      }

      .coming {
        letter-spacing: 4px;
      }

      .subtitle {
        letter-spacing: 4px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="orb"></div>

  <div class="line"></div>
  <div class="line"></div>

  <div id="particles"></div>

  <main class="container">

    <div class="logo glitch" data-text="WAYGO">
      WAYGO
    </div>

    <div class="subtitle">
      Something is coming
    </div>

    <div class="coming">
      COMING SOON
    </div>

    <div class="message">
      The next move starts here.
    </div>

    <button class="sound" onclick="toggleSound()">
      ◉ ENTER THE EXPERIENCE
    </button>

  </main>

  <div class="vignette"></div>
  <div class="scanlines"></div>

  <!--
    AUDIO:
    Nahraď "mysterious.mp3" vlastným mysterióznym trackom.
  -->
  <audio id="music" loop>
    <source src="mysterious.mp3" type="audio/mpeg">
  </audio>

  <script>

    /* PARTICLES */

    const particleContainer =
      document.getElementById("particles");

    for (let i = 0; i < 70; i++) {

      const particle =
        document.createElement("div");

      particle.className = "particle";

      particle.style.left =
        Math.random() * 100 + "%";

      particle.style.animationDuration =
        (5 + Math.random() * 10) + "s";

      particle.style.animationDelay =
        (-Math.random() * 10) + "s";

      particle.style.opacity =
        Math.random();

      particleContainer.appendChild(particle);
    }


    /* MOUSE DOPAMINE EFFECT */

    document.addEventListener("mousemove", (e) => {

      const x =
        (e.clientX / window.innerWidth - .5) * 20;

      const y =
        (e.clientY / window.innerHeight - .5) * 20;

      document.querySelector(".container").style
        .transform =
        `translate(${x}px, ${y}px)`;

    });


    /* MUSIC */

    let playing = false;

    function toggleSound() {

      const music =
        document.getElementById("music");

      const button =
        document.querySelector(".sound");

      if (!playing) {

        music.volume = 0.35;

        music.play();

        playing = true;

        button.innerHTML =
          "◉ EXPERIENCE ACTIVE";

      } else {

        music.pause();

        playing = false;

        button.innerHTML =
          "◉ ENTER THE EXPERIENCE";

      }
    }

  </script>

</body>
</html>
