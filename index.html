<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WayGO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(circle at 20% 20%, #ff4ecd 0%, transparent 30%),
        radial-gradient(circle at 80% 30%, #5b5cff 0%, transparent 35%),
        radial-gradient(circle at 50% 90%, #00e5ff 0%, transparent 35%),
        #080816;

      color: white;
    }

    /* Jemné farebné svetlá */
    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 4s ease-in-out infinite alternate;
    }

    .glow.one {
      background: #ff2dbd;
      top: -100px;
      left: -100px;
    }

    .glow.two {
      background: #635bff;
      right: -100px;
      top: 20%;
      animation-delay: 1s;
    }

    .glow.three {
      background: #00eaff;
      bottom: -120px;
      left: 35%;
      animation-delay: 2s;
    }

    /* Logo */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: logoIn 1.2s cubic-bezier(.17,.67,.3,1.3);
    }

    .logo {
      font-size: clamp(60px, 18vw, 110px);
      font-weight: 900;
      letter-spacing: -6px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #ff55d6,
        #7c6cff,
        #00eaff,
        #ffffff
      );

      background-size: 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation:
        gradient 3s linear infinite,
        pulse 1.8s ease-in-out infinite;
    }

    .tagline {
      margin-top: 10px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.75);
      animation: fadeUp 1.5s ease;
    }

    /* Loading bodky */
    .loading {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: white;
      animation: bounce 1s infinite ease-in-out;
      box-shadow: 0 0 15px rgba(255,255,255,.8);
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    /* Animácie */
    @keyframes logoIn {
      0% {
        opacity: 0;
        transform: scale(.4) rotate(-8deg);
      }

      70% {
        transform: scale(1.08) rotate(2deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes gradient {
      0% {
        background-position: 0%;
      }

      100% {
        background-position: 300%;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(125, 92, 255, .3));
      }

      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 35px rgba(255, 70, 220, .8));
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: .4;
      }

      40% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(40px, -30px) scale(1.2);
      }
    }
  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>

  <div class="container">

    <div class="logo">WayGO</div>

    <div class="tagline">
      LEARN • SCROLL • GROW
    </div>

    <div class="loading">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

  <script>
    // Po 3 sekundách otvorí home.html
    setTimeout(() => {
      window.location.href = "home.html";
    }, 3000);
  </script>

</body>
</html>
