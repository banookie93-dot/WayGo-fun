<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #02010a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Vesmírne pozadie */
        .space {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 50%,
                    rgba(117, 43, 255, 0.16) 0%,
                    rgba(40, 10, 90, 0.08) 25%,
                    transparent 55%),
                radial-gradient(circle at 20% 20%,
                    rgba(157, 77, 255, 0.08),
                    transparent 30%),
                #02010a;
        }

        /* Hviezdy */
        .space::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(circle, #ffffff 1px, transparent 1px),
                radial-gradient(circle, #a967ff 1px, transparent 1px),
                radial-gradient(circle, #6ecbff 1px, transparent 1px);

            background-size:
                110px 110px,
                170px 170px,
                230px 230px;

            background-position:
                10px 20px,
                40px 70px,
                100px 30px;

            opacity: 0.55;
            animation: stars 8s linear infinite;
        }

        @keyframes stars {
            from {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

            to {
                transform: scale(1);
            }
        }

        /* Logo */
        .logo-container {
            position: relative;
            z-index: 2;
            text-align: center;

            animation: logoAppear 1.2s ease-out forwards;
        }

        .logo {
            font-size: clamp(70px, 15vw, 180px);
            font-weight: 800;
            letter-spacing: -8px;
            line-height: 1;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.7),
                0 0 25px rgba(151, 67, 255, 0.8),
                0 0 60px rgba(111, 31, 255, 0.6);
        }

        .logo .go {
            background: linear-gradient(
                90deg,
                #8c36ff,
                #c76cff,
                #744cff
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow: none;
        }

        .tagline {
            margin-top: 25px;

            font-size: 12px;
            letter-spacing: 6px;
            text-transform: uppercase;

            color: #d7c5ff;

            opacity: 0;
            animation: taglineAppear 1s ease-out 0.6s forwards;
        }

        /* Fialová žiara pod logom */
        .glow {
            position: absolute;

            width: 420px;
            height: 100px;

            left: 50%;
            top: 55%;

            transform: translate(-50%, -50%);

            background: #742cff;
            filter: blur(90px);

            opacity: 0.25;

            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes logoAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
                filter: blur(15px);
            }

            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes taglineAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: translate(-50%, -50%) scale(0.9);
            }

            50% {
                opacity: 0.4;
                transform: translate(-50%, -50%) scale(1.15);
            }
        }

        /* Loading bodky */
        .loading {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            gap: 8px;

            z-index: 3;
        }

        .loading span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #a85cff;

            box-shadow:
                0 0 8px #a85cff,
                0 0 16px #7a2cff;

            animation: loading 1s infinite ease-in-out;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes loading {
            0%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-5px);
            }
        }

        /* Mobil */
        @media (max-width: 600px) {
            .logo {
                letter-spacing: -4px;
            }

            .tagline {
                font-size: 9px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="space"></div>

    <div class="glow"></div>

    <main class="logo-container">

        <div class="logo">
            Way<span class="go">Go</span>
        </div>

        <div class="tagline">
            Uč sa. Rasti. Objavuj.
        </div>

    </main>

    <div class="loading">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <script>
        // Po 3 sekundách prejde na home.html
        setTimeout(() => {
            window.location.href = "home.html";
        }, 3000);
    </script>

</body>
</html>
