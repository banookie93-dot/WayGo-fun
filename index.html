<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webtok</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 45%, #24104d 0%, #090014 35%, #000 75%);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Farebné svetlá v pozadí */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 5s ease-in-out infinite alternate;
        }

        body::before {
            background: #ff00cc;
            top: -180px;
            left: -180px;
        }

        body::after {
            background: #00eaff;
            bottom: -180px;
            right: -180px;
            animation-delay: 1s;
        }

        /* Hlavný obsah */
        .container {
            text-align: center;
            position: relative;
            z-index: 2;
            animation: entrance 1.4s cubic-bezier(.17,.67,.3,1.3);
        }

        .logo {
            font-size: 190px;
            font-weight: 1000;
            line-height: 0.8;

            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #ff4fd8 35%,
                #8b5cff 65%,
                #00eaff 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            filter:
                drop-shadow(0 0 10px #ff00cc)
                drop-shadow(0 0 35px #8b5cff)
                drop-shadow(0 0 70px #00eaff);

            animation:
                pulse 2s ease-in-out infinite,
                rainbow 4s linear infinite;
        }

        .name {
            margin-top: 28px;
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 8px;

            text-transform: lowercase;

            text-shadow:
                0 0 10px #fff,
                0 0 25px #ff00cc,
                0 0 50px #8b5cff;

            animation: nameGlow 2s ease-in-out infinite alternate;
        }

        .loading {
            margin-top: 35px;
            font-size: 13px;
            letter-spacing: 4px;
            opacity: 0.65;
            animation: blink 1s infinite;
        }

        /* Malé svetelné bodky */
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: white;
            box-shadow:
                0 0 8px white,
                0 0 18px #ff00cc;
            animation: particle 4s linear infinite;
        }

        .p1 { left: 15%; top: 30%; animation-delay: 0s; }
        .p2 { left: 80%; top: 20%; animation-delay: 1s; }
        .p3 { left: 25%; top: 75%; animation-delay: 2s; }
        .p4 { left: 70%; top: 70%; animation-delay: 0.5s; }
        .p5 { left: 50%; top: 15%; animation-delay: 1.5s; }

        /* Animácie */

        @keyframes entrance {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-8deg);
                filter: blur(20px);
            }

            70% {
                transform: scale(1.08) rotate(2deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
                filter: blur(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        @keyframes nameGlow {
            from {
                opacity: 0.7;
                transform: translateY(0);
            }

            to {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        @keyframes rainbow {
            0% {
                filter:
                    drop-shadow(0 0 10px #ff00cc)
                    drop-shadow(0 0 35px #8b5cff);
            }

            50% {
                filter:
                    drop-shadow(0 0 15px #00eaff)
                    drop-shadow(0 0 45px #8b5cff);
            }

            100% {
                filter:
                    drop-shadow(0 0 10px #ff00cc)
                    drop-shadow(0 0 35px #8b5cff);
            }
        }

        @keyframes float {
            from {
                transform: scale(1) translate(0, 0);
            }

            to {
                transform: scale(1.3) translate(80px, 50px);
            }
        }

        @keyframes particle {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.5);
            }

            30% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateY(-120px) scale(1.5);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 0.25;
            }

            50% {
                opacity: 0.8;
            }
        }

        /* Fade pri prechode */
        body.fade-out {
            animation: fadeOut 0.7s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(1.08);
            }
        }
    </style>
</head>

<body>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

    <div class="container">
        <div class="logo">W</div>

        <div class="name">
            webtok
        </div>

        <div class="loading">
            DISCOVER SOMETHING NEW
        </div>
    </div>

    <script>
        setTimeout(() => {

            document.body.classList.add("fade-out");

            setTimeout(() => {
                window.location.href = "home.html";
            }, 700);

        }, 3000);
    </script>

</body>
</html>
