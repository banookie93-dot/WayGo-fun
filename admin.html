<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WayGo Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><a class="brand" href="index.html">Way<span>Go</span></a><a href="index.html">← Web</a></header><main><h1>Admin panel</h1><p class="muted">Správa obsahu WayGo.</p><button class="primary" id="newContent">+ Pridať obsah</button><div id="adminRows" class="admin"></div></main><dialog id="editor"><form id="editForm" class="modal"><button type="button" class="close" id="closeEditor">×</button><input id="contentId" hidden><input id="title" placeholder="Názov" required><select id="type"><option>lesson</option><option>test</option><option>notes</option><option>video</option><option>method</option></select><select id="cat"><option>Maturita</option><option>Vysoká škola</option><option>Škola</option><option>Hobby</option><option>Zručnosti</option></select><input id="description" placeholder="Krátky popis"><textarea id="body" rows="9" placeholder="Obsah"></textarea><input id="videoUrl" placeholder="Video URL (voliteľné)"><label><input id="published" type="checkbox"> Publikované</label><button class="primary">Uložiť</button></form></dialog><script src="config.js"></script><script src="app.js"></script><script src="admin.js"></script></body></html>
