<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WebTok</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    background: #000;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    top: -250px;
    left: -250px;

    border-radius: 50%;

    background: #ff00cc;

    filter: blur(140px);

    opacity: .22;

    pointer-events: none;

    z-index: 0;
}

body::after {

    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    right: -250px;
    bottom: -250px;

    border-radius: 50%;

    background: #00eaff;

    filter: blur(140px);

    opacity: .20;

    pointer-events: none;

    z-index: 0;
}


/* =====================================================
   TOP NAVBAR
===================================================== */

.top-navbar {

    position: fixed;

    top: 15px;
    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(
            1100px,
            calc(100% - 30px)
        );

    height: 64px;

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius: 20px;

    background:
        rgba(10,10,18,.72);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.35);
}


/* =====================================================
   LOGO
===================================================== */

.logo-area {

    min-width: 160px;

    display: flex;

    align-items: center;

    gap: 9px;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    cursor: pointer;

    padding: 0;

    text-align: left;

    transition:
        transform .25s ease;
}

.logo-area:hover {

    transform:
        scale(1.04);
}

.logo-area:active {

    transform:
        scale(.97);
}

.logo-w {

    font-size: 34px;

    font-weight: 1000;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #ff4fd8,
            #8b5cff,
            #00eaff
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,0,204,.7)
        );

    animation:
        logoPulse
        2.5s
        ease-in-out
        infinite;
}

.logo-name {

    font-size: 18px;

    font-weight: 900;

    letter-spacing: 2px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-area {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 0 18px;
}

.search-input {

    width:
        min(
            390px,
            100%
        );

    height: 42px;

    border:
        1px solid
        rgba(255,255,255,.12);

    outline: none;

    border-radius: 14px;

    background:
        rgba(255,255,255,.06);

    color: white;

    padding:
        0 17px;

    font-size: 13px;

    font-weight: 600;

    transition: .25s;
}

.search-input::placeholder {

    color:
        rgba(255,255,255,.38);
}

.search-input:focus {

    border-color:
        rgba(255,0,204,.5);

    background:
        rgba(255,255,255,.09);

    box-shadow:
        0 0 25px
        rgba(255,0,204,.12);
}


/* =====================================================
   FILTER BUTTON
===================================================== */

.filter-wrapper {

    position: static;
}

.filter-button {

    height: 42px;

    padding:
        0 15px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 14px;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    transition: .25s;

    white-space: nowrap;
}

.filter-button:hover,
.filter-button.active {

    background:
        linear-gradient(
            135deg,
            rgba(255,0,204,.2),
            rgba(139,92,255,.2)
        );

    border-color:
        rgba(255,0,204,.35);
}


/* =====================================================
   SETTINGS
===================================================== */

.settings-button {

    min-width: 48px;

    display: flex;

    align-items: center;

    justify-content: flex-end;
}

.settings-button button {

    width: 42px;
    height: 42px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 13px;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 21px;

    cursor: pointer;

    transition: .25s;
}

.settings-button button:hover {

    transform:
        rotate(25deg)
        scale(1.08);

    background:
        rgba(139,92,255,.18);

    border-color:
        rgba(139,92,255,.45);
}


/* =====================================================
   FILTER MENU
===================================================== */

.filter-menu {

    position: fixed;

    top: 0;
    right: 0;
    bottom: 0;
    left: 0;

    width: 100%;
    height: 100%;

    overflow-y: auto;

    padding:
        105px
        25px
        125px;

    background:
        rgba(5,5,10,.97);

    backdrop-filter:
        blur(35px);

    -webkit-backdrop-filter:
        blur(35px);

    opacity: 0;

    visibility: hidden;

    transform:
        scale(.97);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s ease;

    z-index: 9999;
}

.filter-menu.open {

    opacity: 1;

    visibility: visible;

    transform:
        scale(1);
}

.filter-top {

    width:
        min(
            800px,
            100%
        );

    margin:
        0 auto 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.filter-title {

    font-size:
        clamp(
            30px,
            6vw,
            52px
        );

    font-weight: 1000;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff4fd8,
            #8b5cff,
            #00eaff
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;
}

.close-filter {

    width: 48px;
    height: 48px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 15px;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 22px;

    cursor: pointer;
}

.filter-content {

    width:
        min(
            800px,
            100%
        );

    margin: 0 auto;
}

.filter-group {

    margin-bottom: 30px;
}

.filter-heading {

    font-size: 11px;

    font-weight: 900;

    letter-spacing: 1.7px;

    text-transform: uppercase;

    color:
        rgba(255,255,255,.42);

    margin:
        0 0 11px;
}

.filter-options {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap: 8px;
}

.filter-option {

    min-height: 45px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.65);

    padding:
        10px 9px;

    border-radius: 13px;

    text-align: center;

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.filter-option:hover {

    color: white;

    background:
        rgba(255,255,255,.09);
}

.filter-option.selected {

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(255,0,204,.22),
            rgba(139,92,255,.22)
        );

    border-color:
        rgba(255,0,204,.35);
}

.language-select {

    width: 100%;

    height: 50px;

    padding:
        0 14px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 13px;

    outline: none;

    background:
        rgba(255,255,255,.05);

    color: white;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;
}

.language-select option {

    background: #11111a;

    color: white;
}

.filter-footer {

    width:
        min(
            800px,
            100%
        );

    margin:
        35px auto 0;

    display: flex;

    gap: 10px;
}

.reset-button,
.apply-button {

    flex: 1;

    height: 52px;

    border-radius: 14px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 900;
}

.reset-button {

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.05);

    color:
        rgba(255,255,255,.7);
}

.apply-button {

    border: none;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #8b5cff
        );

    color: white;
}


/* =====================================================
   ABOUT POPUP
===================================================== */

.about-overlay {

    position: fixed;

    inset: 0;

    z-index: 10000;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(18px);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .25s ease;
}

.about-overlay.open {

    opacity: 1;

    visibility: visible;
}

.about-popup {

    position: relative;

    width:
        min(
            430px,
            100%
        );

    padding:
        42px 30px 30px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(25,18,35,.96),
            rgba(8,8,15,.97)
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.65),

        0 0 60px
        rgba(255,0,204,.12);

    text-align: center;

    transform:
        translateY(25px)
        scale(.94);

    transition:
        transform .35s ease;
}

.about-overlay.open
.about-popup {

    transform:
        translateY(0)
        scale(1);
}

.about-popup-logo {

    width: 90px;
    height: 90px;

    margin:
        0 auto 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 27px;

    font-size: 50px;

    font-weight: 1000;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #8b5cff,
            #00eaff
        );

    box-shadow:
        0 0 25px
        rgba(255,0,204,.4);
}

.about-popup-title {

    font-size: 32px;

    font-weight: 1000;

    letter-spacing: 1px;
}

.about-popup-subtitle {

    margin-top: 7px;

    font-size: 13px;

    font-weight: 800;

    color:
        #ff63d5;
}

.about-popup-text {

    margin:
        22px auto 25px;

    max-width: 350px;

    color:
        rgba(255,255,255,.62);

    font-size: 14px;

    line-height: 1.65;
}

.about-more {

    width: 100%;

    height: 52px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #8b5cff
        );

    color: white;

    font-size: 13px;

    font-weight: 900;

    cursor: pointer;
}

.about-close {

    position: absolute;

    top: 15px;
    right: 15px;

    width: 38px;
    height: 38px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 12px;

    background:
        rgba(255,255,255,.05);

    color:
        rgba(255,255,255,.7);

    font-size: 21px;

    cursor: pointer;
}


/* =====================================================
   SEARCH SUGGESTION
===================================================== */

.search-results {

    position: fixed;

    top: 90px;

    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(
            500px,
            calc(100% - 30px)
        );

    z-index: 500;

    pointer-events: none;
}

.suggestion-card {

    pointer-events: auto;

    padding: 20px;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius: 20px;

    background:
        rgba(12,12,20,.94);

    backdrop-filter:
        blur(25px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);

    animation:
        suggestionIn
        .25s
        ease;
}

.suggestion-title {

    font-size: 16px;

    font-weight: 900;

    word-break: break-word;
}

.suggestion-text {

    margin-top: 8px;

    color:
        rgba(255,255,255,.55);

    font-size: 12px;

    line-height: 1.5;
}

.suggest-button {

    width: 100%;

    height: 46px;

    margin-top: 16px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #8b5cff
        );

    color: white;

    font-size: 12px;

    font-weight: 900;

    cursor: pointer;

    transition: .2s;
}

.suggest-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 0 25px
        rgba(255,0,204,.3);
}

.suggest-button:disabled {

    opacity: .5;

    cursor: not-allowed;

    transform: none;
}

.suggestion-close {

    width: 100%;

    height: 38px;

    margin-top: 7px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 12px;

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.6);

    cursor: pointer;

    font-size: 11px;

    font-weight: 800;
}

.suggestion-success {

    text-align: center;

    padding: 10px 5px;
}

.success-mark {

    font-size: 35px;

    color: #67ffcf;

    margin-bottom: 10px;
}


/* =====================================================
   HORIZONTAL APP
===================================================== */

.horizontal-app {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    transform:
        translateX(-100vw);

    transition:
        transform .55s
        cubic-bezier(
            .22,
            .61,
            .36,
            1
        );

    z-index: 2;
}

.section {

    flex:
        0 0 100vw;

    width: 100vw;
    height: 100vh;

    position: relative;

    overflow: hidden;
}

.page-frame {

    width: 100%;
    height: 100%;

    border: none;

    background: #000;
}


/* =====================================================
   HOME FEED
===================================================== */

.feed {

    width: 100%;
    height: 100%;

    overflow-y: auto;

    overflow-x: hidden;

    scroll-snap-type:
        y mandatory;

    scrollbar-width: none;
}

.feed::-webkit-scrollbar {

    display: none;
}

.web-card {

    width: 100%;

    height: 100vh;

    scroll-snap-align: start;

    scroll-snap-stop: always;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    padding:
        100px
        20px
        110px;
}

.website {

    width:
        min(
            900px,
            92vw
        );

    height:
        min(
            650px,
            75vh
        );

    border-radius: 28px;

    overflow: hidden;

    background: white;

    box-shadow:

        0 0 30px
        rgba(255,0,204,.3),

        0 0 80px
        rgba(139,92,255,.2);
}

.website-header {

    height: 55px;

    background: #f5f5f5;

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        0 18px;
}

.dot {

    width: 11px;
    height: 11px;

    border-radius: 50%;
}

.red {
    background: #ff5f57;
}

.yellow {
    background: #ffbd2e;
}

.green {
    background: #28c840;
}

.website-frame {

    width: 100%;

    height:
        calc(
            100% - 55px
        );

    border: none;
}


/* =====================================================
   CARD INFO
===================================================== */

.info {

    position: absolute;

    left:
        max(
            20px,
            calc(
                (100vw - 980px) / 2
            )
        );

    bottom: 105px;

    max-width: 450px;

    z-index: 10;

    text-shadow:
        0 0 10px #000;
}

.creator {

    font-size: 16px;

    font-weight: 900;
}

.description {

    margin-top: 7px;

    color:
        rgba(255,255,255,.8);

    font-size: 14px;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions {

    position: absolute;

    right:
        max(
            20px,
            calc(
                (100vw - 980px) / 2
            )
        );

    bottom: 150px;

    z-index: 10;

    display: flex;

    flex-direction: column;

    gap: 16px;
}

.action {

    width: 54px;
    height: 54px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.18);

    background:
        rgba(10,10,15,.65);

    backdrop-filter:
        blur(18px);

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    transition: .2s;
}

.action:hover {

    transform:
        scale(1.1);
}

.action.liked {

    color: #ff2bc2;

    background:
        rgba(255,0,204,.2);

    border-color:
        rgba(255,0,204,.5);
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;
}

.empty-content {

    max-width: 500px;
}

.empty-logo {

    width: 90px;
    height: 90px;

    margin:
        0 auto 25px;

    border-radius: 27px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 48px;

    font-weight: 1000;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #8b5cff,
            #00eaff
        );

    box-shadow:
        0 0 30px
        rgba(255,0,204,.45);
}

.empty-content h1 {

    font-size:
        clamp(
            28px,
            5vw,
            46px
        );
}

.empty-content p {

    margin-top: 14px;

    color:
        rgba(255,255,255,.55);

    font-size: 16px;

    line-height: 1.6;
}

.coming-soon {

    display: inline-block;

    margin-top: 25px;

    padding:
        10px 17px;

    border-radius: 999px;

    border:
        1px solid
        rgba(139,92,255,.4);

    color: #bda8ff;

    font-size: 11px;

    font-weight: 900;

    letter-spacing: 2px;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {

    position: fixed;

    left: 50%;

    bottom: 15px;

    transform:
        translateX(-50%);

    z-index: 200;

    width:
        min(
            430px,
            calc(100% - 20px)
        );

    height: 66px;

    display: flex;

    align-items: center;

    justify-content: space-around;

    padding:
        6px 10px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 23px;

    background:
        rgba(12,12,20,.82);

    backdrop-filter:
        blur(25px);
}

.nav-item {

    position: relative;

    width: 110px;

    height: 54px;

    border: none;

    background: transparent;

    color:
        rgba(255,255,255,.45);

    cursor: pointer;

    border-radius: 17px;

    font-size: 13px;

    font-weight: 800;

    transition: .25s;
}

.nav-item.active {

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(255,0,204,.18),
            rgba(139,92,255,.18)
        );
}

.nav-item.active::after {

    content: "";

    position: absolute;

    left: 50%;
    bottom: 5px;

    transform:
        translateX(-50%);

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #ff2bc2;

    box-shadow:
        0 0 10px #ff2bc2;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;
}

.loader {

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border:
        3px solid
        rgba(255,255,255,.1);

    border-top-color: #ff00cc;

    border-right-color: #8b5cff;

    animation:
        spin .8s
        linear infinite;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}

@keyframes logoPulse {

    0%,
    100% {
        transform:
            scale(1);
    }

    50% {
        transform:
            scale(1.06);
    }
}

@keyframes suggestionIn {

    from {

        opacity: 0;

        transform:
            translateY(-10px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .top-navbar {

        top: 10px;

        width:
            calc(
                100% - 20px
            );

        height: 58px;

        padding:
            0 9px;
    }

    .logo-area {

        min-width: auto;
    }

    .logo-name {

        display: none;
    }

    .logo-w {

        font-size: 32px;
    }

    .search-area {

        padding:
            0 7px;

        )

    document
        .querySelectorAll(

}


/* =====================================================
   FILTERS

function toggleFilters() {

    const menu =
        document.getElementById(
            "filterMenu"

    const button =

}

            "filterButton"

        .classList
        .remove("active");

}


function selectFilter(button) {

    const type =
        button.dataset.filterType;

    const value =
        button.dataset.value;


    filters[type] =
        value;


    document
        .querySelectorAll(
            `[data-filter-type="${type}"]`
        )

            item => {

}


/* =====================================================

function generateLanguages() {

/* =====================================================

===================================================== */

function applyFilters() {

    renderResults();

function resetFilters() {

    filters = {

        sort: "newest",

        category: "all",

        language: "all",

        .getElementById(

        .value =
            "all";


    renderResults();

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            clearTimeout(
                searchTimer
            );


            searchTimer =
                setTimeout(
                    () => {

                        renderResults();

                    },
                    150
                );

        }
    );


/* =====================================================
   SEARCH NORMALIZATION
===================================================== */

function normalizeUrl(value) {

    let url =
        String(value || "")
            .trim();


    if (!url) {

        return "";

    }


    if (
        !/^https?:\/\//i.test(url)
    ) {

        url =
            "https://" + url;

    }


    try {

        const parsed =
            new URL(url);


        return (
            parsed.origin +
            parsed.pathname
        )
            .replace(
                /\/$/,
                ""
            )
            .toLowerCase();

    }
    catch {

        return "";

    }

}


/* =====================================================
   SEARCH DISPLAY NAME
===================================================== */

function getDomain(value) {

    try {

        const url =
            normalizeUrl(value);

        if (!url) {
            return value;
        }

        return new URL(url).hostname;

    }
    catch {

        return value;

    }

}


/* =====================================================
   SEARCH RESULTS
===================================================== */

function searchWebsiteExists(
    search
) {

    const normalizedSearch =
        normalizeUrl(search);


    return allWebsites.some(
        website => {

            const websiteUrl =
                normalizeUrl(
                    website.url
                );


            if (
                normalizedSearch &&
                websiteUrl
            ) {

                return (
                    normalizedSearch ===
                    websiteUrl
                );

            }


            const text = [

                website.title,

                website.description,

                website.username,

                website.category

            ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


            return text.includes(
                search.toLowerCase()
            );

        }
    );

}


function renderSearchSuggestion(
    search
) {

    const container =
        document.getElementById(
            "searchResults"
        );


    if (!search) {

        container.innerHTML =
            "";

        return;

    }


    if (
        search.length < 3
    ) {

        container.innerHTML =
            "";

        return;

    }


    const exists =
        searchWebsiteExists(
            search
        );


    if (exists) {

        container.innerHTML =
            "";

        return;

    }


    const url =
        normalizeUrl(
            search
        );


    if (!url) {

        container.innerHTML =
            "";

        return;

    }


    const domain =
        getDomain(
            url
        );


    container.innerHTML = `

        <div class="suggestion-card">

            <div class="suggestion-title">
                ${escapeHTML(domain)}
            </div>

            <div class="suggestion-text">

                This website isn't on
                WebTok yet. You can suggest
                it to the WebTok admin.

            </div>

            <button
                class="suggest-button"
                onclick="submitSuggestion(
                    '${escapeAttribute(url)}'
                )"
            >
                Suggest this website
            </button>

            <button
                class="suggestion-close"
                onclick="closeSearchSuggestion()"
            >
                Close
            </button>

        </div>

    `;

}


/* =====================================================
   SUBMIT SUGGESTION
===================================================== */

async function submitSuggestion(
    url
) {

    const button =
        document.querySelector(
            ".suggest-button"
        );


    if (button) {

        button.disabled = true;

        button.textContent =
            "Sending...";

    }


    try {

        const normalizedUrl =
            normalizeUrl(url);


        if (!normalizedUrl) {

            throw new Error(
                "Invalid URL"
            );

        }


        /*
         * Check whether the suggestion
         * already exists.
         */

        const {
            data: existing,
            error: existingError
        } =
            await supabaseClient
                .from(
                    "website_suggestions"
                )
                .select("id,status")
                .eq(
                    "url",
                    normalizedUrl
                )
                .limit(1);


        if (existingError) {

            throw existingError;

        }


        if (
            existing &&
            existing.length > 0
        ) {

            showSuggestionSuccess(
                "This website has already been suggested."
            );

            return;

        }


        /*
         * Get current user.
         *
         * If the visitor isn't logged in,
         * suggested_by stays null.
         */

        const {
            data: {
                user
            }
        } =
            await supabaseClient
                .auth
                .getUser();


        const {
            error
        } =
            await supabaseClient
                .from(
                    "website_suggestions"
                )
                .insert({

                    url:
                        normalizedUrl,

                    suggested_by:
                        user
                            ? user.id
                            : null,

                    status:
                        "pending"

                });


        if (error) {

            throw error;

        }


        showSuggestionSuccess(
            "Your suggestion has been sent to the WebTok admin."
        );

    }
    catch (error) {

        console.error(
            "Suggestion error:",
            error
        );


        if (button) {

            button.disabled = false;

            button.textContent =
                "Suggest this website";

        }


        const container =
            document.getElementById(
                "searchResults"
            );


        container.innerHTML = `

            <div class="suggestion-card">

                <div class="suggestion-title">
                    Something went wrong
                </div>

                <div class="suggestion-text">
                    The suggestion could not
                    be sent. Please try again.
                </div>

                <button
                    class="suggestion-close"
                    onclick="closeSearchSuggestion()"
                >
                    Close
                </button>

            </div>

        `;

    }

}


/* =====================================================
   SUCCESS
===================================================== */

function showSuggestionSuccess(
    message
) {

    const container =
        document.getElementById(
            "searchResults"
        );


    container.innerHTML = `

        <div class="suggestion-card">

            <div class="suggestion-success">

                <div class="success-mark">
                    ✓
                </div>

                <div class="suggestion-title">
                    Suggestion sent
                </div>

                <div class="suggestion-text">
                    ${escapeHTML(message)}
                </div>

            </div>

            <button
                class="suggestion-close"
                onclick="closeSearchSuggestion()"
            >
                Done
            </button>

        </div>

    `;

}


function closeSearchSuggestion() {

    document
        .getElementById(
            "searchResults"
        )
        .innerHTML =
            "";

}


/* =====================================================
   RENDER RESULTS
===================================================== */

function renderResults() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    /*
     * Search suggestion.
     */

    renderSearchSuggestion(
        search
    );


    /*
     * Normal feed filtering.
     */

    let websites =
        [...allWebsites];


    if (search) {

        websites =
            websites.filter(
                website => {

                    const text = [

                        website.title,

                        website.description,

                        website.username,

                        website.category,

                        website.language,

                        website.url

                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    return text.includes(
                        search
                    );

                }
            );

    }


    if (
        filters.category !== "all"
    ) {

        websites =
            websites.filter(
                website =>
                    String(
                        website.category || ""
                    )
                    .toLowerCase()
                    ===
                    filters.category
            );

    }


    if (
        filters.language !== "all"
    ) {

        websites =
            websites.filter(
                website =>
                    String(
                        website.language || ""
                    )
                    .toLowerCase()
                    .startsWith(
                        filters.language
                    )
            );

    }


    if (
        filters.access === "free"
    ) {

        websites =
            websites.filter(
                website =>
                    website.requires_account
                    !== true
            );

    }


    if (
        filters.access === "account"
    ) {

        websites =
            websites.filter(
                website =>
                    website.requires_account
                    === true
            );

    }


    if (
        filters.sort === "newest"
    ) {

        websites.sort(
            (a,b) =>
                new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                )
        );

    }


    if (
        filters.sort === "oldest"
    ) {

        websites.sort(
            (a,b) =>
                new Date(
                    a.created_at || 0
                ) -
                new Date(
                    b.created_at || 0
                )
        );

    }


    if (
        filters.sort === "liked"
    ) {

        websites.sort(
            (a,b) =>
                Number(
                    b.likes || 0
                ) -
                Number(
                    a.likes || 0
                )
        );

    }


    if (
        filters.sort === "views"
    ) {

        websites.sort(
            (a,b) =>
                Number(
                    b.views || 0
                ) -
                Number(
                    a.views || 0
                )
        );

    }


    /*
     * If search has no existing result,
     * don't replace the empty Home state
     * with "nothing" unnecessarily.
     */

    if (
        websites.length === 0
    ) {

        if (search) {

            showNoResults();

        }
        else {

            showEmptyState();

        }

        return;

    }


    renderFeed(
        websites
    );

}


/* =====================================================
   LOAD WEBSITES
===================================================== */

async function loadWebsites() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("websites")
                .select("*");


        if (error) {

            console.error(
                error
            );

            showEmptyState();

            return;

        }


        allWebsites =
            data || [];


        if (
            allWebsites.length === 0
        ) {

            showEmptyState();

            return;

        }


        renderResults();

    }
    catch (error) {

        console.error(
            error
        );

        showEmptyState();

    }

}


/* =====================================================
   FEED
===================================================== */

function renderFeed(
    websites
) {

    const homeContent =
        document.getElementById(
            "homeContent"
        );


    homeContent.innerHTML = `

        <main class="feed">

            ${
                websites
                    .map(
                        createWebsiteCard
                    )
                    .join("")
            }

        </main>

    `;

}


/* =====================================================
   WEBSITE CARD
===================================================== */

function createWebsiteCard(
    website
) {

    const title =
        escapeHTML(
            website.title ||
            "WebTok website"
        );


    const description =
        escapeHTML(
            website.description ||
            "Discover this website on WebTok."
        );


    const username =
        escapeHTML(
            website.username ||
            "webtok"
        );


    const url =
        escapeAttribute(
            website.url ||
            ""
        );


    return `

        <section class="web-card">

            <div class="website">

                <div class="website-header">

                    <div class="dot red"></div>

                    <div class="dot yellow"></div>

                    <div class="dot green"></div>

                </div>


                <iframe

                    class="website-frame"

                    src="${url}"

                    title="${title}"

                    loading="lazy"

                    sandbox="
                        allow-scripts
                        allow-forms
                        allow-popups
                        allow-same-origin
                    "

                ></iframe>

            </div>


            <div class="actions">

                <button
                    class="action"
                    onclick="like(this)"
                    aria-label="Like"
                >

                    <span
                        style="
                            font-size:28px;
                            line-height:1;
                        "
                    >
                        ♡
                    </span>

                </button>


                <button
                    class="action"
                    onclick="shareWebsite()"
                    aria-label="Share"
                >

                    <span
                        style="
                            font-size:23px;
                            line-height:1;
                        "
                    >
                        ↗
                    </span>

                </button>

            </div>


            <div class="info">

                <div class="creator">
                    @${username}
                </div>

                <div class="description">
                    ${description}
                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   EMPTY STATES
===================================================== */

function showEmptyState() {

    document
        .getElementById(

        )
        .innerHTML = `

        <div class="empty-state">

            <div class="empty-content">

                <div class="empty-logo">

                </div>

                <h1>

                </h1>

function showNoResults() {

    document
        .getElementById(
            "homeContent"
        )
        .innerHTML = `

        <div class="empty-state">

            <div class="empty-content">

                <div class="empty-logo">
                    W
                </div>

                <h1>

                </h1>

                <p>

                </p>

/* =====================================================
   LIKE
===================================================== */

function like(button) {

    button.classList.toggle(
        "liked"
    );

}


/* =====================================================
   SHARE
===================================================== */

async function shareWebsite() {

    try {

        if (
            navigator.share
        ) {

            await navigator.share({

                title:
                    "WebTok",

                text:
                    "Discover this website on WebTok!",

                url:
                    window.location.href

            });

        }
        else {

            await navigator.clipboard
                .writeText(
                    window.location.href
                );

            alert(
                "Link copied!"
            );

        }

    }
    catch {

        console.log(
            "Share cancelled"
        );

    }

}


/* =====================================================
   TOUCH NAVIGATION
===================================================== */

let touchStartX = 0;

let touchStartY = 0;


document.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    event => {

        const filterMenu =
            document.getElementById(
                "filterMenu"
            );


        const aboutPopup =
            document.getElementById(
                "aboutPopup"
            );


        if (
            filterMenu.classList
                .contains("open")
        ) {

            return;

        }


        if (
            aboutPopup.classList
                .contains("open")
        ) {

            return;

        }


        const endX =
            event.changedTouches[0].clientX;

        const endY =
            event.changedTouches[0].clientY;


        const diffX =
            endX - touchStartX;

        const diffY =
            endY - touchStartY;


        /*
         * HORIZONTAL SECTION SWIPE
         */

        if (
            Math.abs(diffX) >
            Math.abs(diffY)
        ) {

            if (
                Math.abs(diffX) < 70
            ) {

                return;

            }


            if (
                diffX < 0
            ) {

                goToSection(
                    currentSection + 1
                );

            }
            else {

                goToSection(
                    currentSection - 1
                );

            }


            return;

        }


        /*
         * VERTICAL WEBSITE SWIPE
         */

        if (
            currentSection !== 1
        ) {

            return;

        }


        if (
            Math.abs(diffY) < 70
        ) {

            return;

        }


        const feed =
            document.querySelector(
                ".feed"
            );


        if (!feed) {

            return;

        }


        const cards =
            document.querySelectorAll(
                ".web-card"
            );


        if (!cards.length) {

            return;

        }


        const current =
            Math.round(
                feed.scrollTop /
                window.innerHeight
            );


        let next;


        if (
            diffY < 0
        ) {

            next =
                Math.min(
                    current + 1,
                    cards.length - 1
                );

        }
        else {

            next =
                Math.max(
                    current - 1,
                    0
                );

        }


        cards[next]
            .scrollIntoView({

                behavior:
                    "smooth",

                block:
                    "start"

            });

    },
    {
        passive: true
    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeFilters();

            closeAboutPopup();

            closeSearchSuggestion();

            return;

        }


        const filterOpen =
            document
                .getElementById(
                    "filterMenu"
                )
                .classList
                .contains("open");


        if (filterOpen) {

            return;

        }


        /*
         * Horizontal sections
         */

        if (
            event.key === "ArrowLeft"
        ) {

            goToSection(
                currentSection - 1
            );

            return;

        }


        if (
            event.key === "ArrowRight"
        ) {

            goToSection(
                currentSection + 1
            );

            return;

        }


        /*
         * Vertical feed
         */

        if (
            currentSection !== 1
        ) {

            return;

        }


        if (
            event.key !== "ArrowUp" &&
            event.key !== "ArrowDown"
        ) {

            return;

        }


        const feed =
            document.querySelector(
                ".feed"
            );


        if (!feed) {

            return;

        }


        const cards =
            document.querySelectorAll(
                ".web-card"
            );


        if (!cards.length) {

            return;

        }


        event.preventDefault();


        const current =
            Math.round(
                feed.scrollTop /
                window.innerHeight
            );


        let next;


        if (
            event.key === "ArrowDown"
        ) {

            next =
                Math.min(
                    current + 1,
                    cards.length - 1
                );

        }
        else {

            next =
                Math.max(
                    current - 1,
                    0
                );

        }


        cards[next]
            .scrollIntoView({

                behavior:
                    "smooth",

                block:
                    "start"

            });

    }
);


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHTML(
        value
    )
    .replace(
        /`/g,
        "&#096;"
    );

}

generateLanguages();

goToSection(1);

loadWebsites();
