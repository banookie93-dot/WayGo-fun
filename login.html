<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebTok - Login</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #24104d 0%,
                    #090014 35%,
                    #000 75%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            animation: pageAppear 0.8s ease;
        }


        /* ==========================================
           NEON BACKGROUND
        ========================================== */

        body::before,
        body::after {

            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.45;

            pointer-events: none;

            animation:
                floatingGlow
                6s
                ease-in-out
                infinite
                alternate;
        }


        body::before {

            background: #ff00cc;

            top: -180px;
            left: -180px;
        }


        body::after {

            background: #00eaff;

            bottom: -180px;
            right: -180px;

            animation-delay: 1s;
        }


        /* ==========================================
           LOGIN BOX
        ========================================== */

        .login-box {

            position: relative;

            z-index: 2;

            width: 360px;

            padding: 42px 35px;

            text-align: center;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.15);

            border-radius: 28px;

            backdrop-filter:
                blur(25px);

            box-shadow:
                0 0 40px
                rgba(139,92,255,0.25);

            animation:
                boxEntrance
                1s
                cubic-bezier(.17,.67,.3,1.3);
        }


        /* ==========================================
           LOGO
        ========================================== */

        .logo {

            font-size: 78px;

            font-weight: 1000;

            line-height: 1;

            background:

                linear-gradient(
                    135deg,
                    #ffffff,
                    #ff4fd8,
                    #8b5cff,
                    #00eaff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            filter:

                drop-shadow(
                    0 0 10px #ff00cc
                )

                drop-shadow(
                    0 0 25px #8b5cff
                )

                drop-shadow(
                    0 0 45px #00eaff
                );

            animation:
                logoPulse
                2.5s
                ease-in-out
                infinite;
        }


        /* ==========================================
           TEXT
        ========================================== */

        h1 {

            margin-top: 15px;

            font-size: 28px;

            font-weight: 800;
        }


        .subtitle {

            margin-top: 8px;

            margin-bottom: 20px;

            color:
                rgba(255,255,255,0.55);

            font-size: 14px;
        }


        /* ==========================================
           INPUTS
        ========================================== */

        .input {

            width: 100%;

            height: 55px;

            margin-top: 14px;

            padding: 0 18px;

            border-radius: 15px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            outline: none;

            background:
                rgba(0,0,0,0.4);

            color: white;

            font-size: 15px;

            transition:
                0.25s;
        }


        .input::placeholder {

            color:
                rgba(255,255,255,0.4);
        }


        .input:focus {

            border-color:
                #8b5cff;

            box-shadow:
                0 0 15px
                rgba(139,92,255,0.5);
        }


        /* ==========================================
           LOGIN BUTTON
        ========================================== */

        .login-button {

            width: 100%;

            height: 58px;

            margin-top: 25px;

            border: none;

            border-radius: 17px;

            background:

                linear-gradient(
                    135deg,
                    #ff00cc,
                    #8b5cff,
                    #00eaff
                );

            color: white;

            font-size: 17px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:

                0 0 20px
                rgba(255,0,204,0.5);

            transition:
                0.25s;

            position: relative;

            overflow: hidden;
        }


        .login-button:hover {

            transform:
                translateY(-3px)
                scale(1.03);

            box-shadow:

                0 0 25px #ff00cc,

                0 0 45px #8b5cff;
        }


        .login-button:active {

            transform:
                scale(0.96);
        }


        .login-button:disabled {

            opacity: 0.6;

            cursor: wait;
        }


        /* Shine */

        .login-button::after {

            content: "";

            position: absolute;

            top: 0;

            left: -120%;

            width: 70%;

            height: 100%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.4),
                    transparent
                );

            transform:
                skewX(-20deg);

            animation:
                shine
                3.5s
                infinite;
        }


        /* ==========================================
           MESSAGE
        ========================================== */

        .message {

            min-height: 20px;

            margin-top: 15px;

            font-size: 14px;
        }


        /* ==========================================
           SIGN UP
        ========================================== */

        .signup {

            margin-top: 23px;

            color:
                rgba(255,255,255,0.55);

            font-size: 14px;
        }


        .signup a {

            color: #00eaff;

            text-decoration: none;

            font-weight: 800;
        }


        .signup a:hover {

            text-shadow:
                0 0 12px #00eaff;
        }


        /* ==========================================
           BACK
        ========================================== */

        .back {

            position: fixed;

            top: 25px;

            left: 25px;

            z-index: 10;

            color:
                rgba(255,255,255,0.6);

            text-decoration: none;

            font-size: 14px;

            transition:
                0.2s;
        }


        .back:hover {

            color: white;

            transform:
                translateX(-3px);
        }


        /* ==========================================
           ANIMATIONS
        ========================================== */

        @keyframes pageAppear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        @keyframes boxEntrance {

            from {

                opacity: 0;

                transform:
                    scale(0.8)
                    translateY(30px);

                filter:
                    blur(10px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

                filter:
                    blur(0);
            }
        }


        @keyframes logoPulse {

            0%,
            100% {

                transform:
                    scale(1);
            }

            50% {

                transform:
                    scale(1.05);
            }
        }


        @keyframes floatingGlow {

            from {

                transform:
                    translate(0,0)
                    scale(1);
            }

            to {

                transform:
                    translate(80px,50px)
                    scale(1.3);
            }
        }


        @keyframes shine {

            0% {

                left: -120%;
            }

            25% {

                left: 150%;
            }

            100% {

                left: 150%;
            }
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 500px) {

            .login-box {

                width:
                    calc(100% - 30px);

                padding:
                    40px 25px;
            }
        }

    </style>

</head>


<body>


    <!-- BACK -->

    <a
        href="main.html"
        class="back">

        ← Back

    </a>


    <!-- LOGIN -->

    <div class="login-box">


        <div class="logo">

            W

        </div>


        <h1>

            Welcome back

        </h1>


        <div class="subtitle">

            Login to continue your WebTok journey.

        </div>


        <input
            id="email"
            class="input"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >


        <input
            id="password"
            class="input"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button
            id="loginButton"
            class="login-button"
            onclick="login()">

            Login

        </button>


        <div
            id="message"
            class="message">
        </div>


        <div class="signup">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </div>


    </div>


    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        /* ==========================================
           SUPABASE
        ========================================== */

        const SUPABASE_URL =
            "https://smfvllbwzbnenjrllfqw.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_MKLzWWJG8xkltmNcEL24fg_PCSclHEs";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           LOGIN
        ========================================== */

        async function login() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const button =
                document
                    .getElementById("loginButton");


            const message =
                document
                    .getElementById("message");


            message.textContent = "";


            /* Kontrola */

            if (!email || !password) {

                message.textContent =
                    "Vyplň email a heslo.";

                message.style.color =
                    "#ff4fd8";

                return;
            }


            /* Loading */

            button.disabled = true;

            button.textContent =
                "Logging in...";


            /* Supabase login */

            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            /* Chyba */

            if (error) {

                console.error(error);

                message.textContent =
                    error.message;

                message.style.color =
                    "#ff4d6d";

                button.disabled = false;

                button.textContent =
                    "Login";

                return;
            }


            /* Úspešné prihlásenie */

            console.log(
                "Logged in:",
                data
            );


            message.textContent =
                "Welcome to WebTok! 🚀";


            message.style.color =
                "#00eaff";


            button.textContent =
                "Success ✓";


            /*
             * Po úspešnom login-e
             * presunieme používateľa
             * na main.html
             */

            setTimeout(() => {

                window.location.href =
                    "main.html";

            }, 700);

        }

    </script>

</body>
</html>
