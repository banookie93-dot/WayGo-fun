<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WebTok — Account</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            top: -250px;
            left: -200px;
            border-radius: 50%;
            background: #ff00cc;
            filter: blur(150px);
            opacity: .18;
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            right: -250px;
            bottom: -250px;
            border-radius: 50%;
            background: #00eaff;
            filter: blur(150px);
            opacity: .16;
            pointer-events: none;
            z-index: -1;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 60px 20px 125px;
        }

        .container {
            width: min(700px, 100%);
            margin: 0 auto;
        }

        /* PROFILE */

        .account-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-picture {
            width: 105px;
            height: 105px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background:
                linear-gradient(
                    135deg,
                    #ff00cc,
                    #8b5cff,
                    #00eaff
                );
            font-size: 45px;
            font-weight: 1000;
            box-shadow:
                0 0 30px rgba(255,0,204,.35),
                0 0 70px rgba(139,92,255,.15);
        }

        .username {
            font-size: 27px;
            font-weight: 1000;
        }

        .email {
            margin-top: 7px;
            color: rgba(255,255,255,.4);
            font-size: 13px;
        }

        .bio {
            max-width: 500px;
            margin: 15px auto 0;
            padding: 0 15px;
            color: rgba(255,255,255,.65);
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .bio.empty {
            color: rgba(255,255,255,.3);
            font-style: italic;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat {
            padding: 22px 10px;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 20px;
            background: rgba(255,255,255,.045);
            text-align: center;
            cursor: pointer;
            transition: .2s ease;
        }

        .stat:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,.08);
        }

        .stat-number {
            font-size: 25px;
            font-weight: 1000;
        }

        .stat-label {
            margin-top: 7px;
            color: rgba(255,255,255,.42);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* SECTION */

        .section {
            margin-top: 30px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 19px;
            font-weight: 1000;
        }

        .section-subtitle {
            margin-top: 5px;
            color: rgba(255,255,255,.38);
            font-size: 12px;
        }

        /* ROOMS */

        .rooms {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .room {
            padding: 19px;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 20px;
            background: rgba(255,255,255,.045);
            cursor: pointer;
            transition: .2s ease;
        }

        .room:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,.075);
            border-color: rgba(255,255,255,.16);
        }

        .room-name {
            font-size: 16px;
            font-weight: 900;
        }

        .room-description {
            margin-top: 7px;
            color: rgba(255,255,255,.5);
            font-size: 12px;
            line-height: 1.5;
        }

        .room-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 13px;
            color: rgba(255,255,255,.38);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .room-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #8b5cff;
        }

        /* EMPTY ROOMS */

        .empty-rooms {
            padding: 35px 20px;
            text-align: center;
            border: 1px dashed rgba(255,255,255,.12);
            border-radius: 22px;
            background: rgba(255,255,255,.025);
        }

        .empty-title {
            font-size: 17px;
            font-weight: 900;
        }

        .empty-text {
            max-width: 400px;
            margin: 9px auto 20px;
            color: rgba(255,255,255,.42);
            font-size: 12px;
            line-height: 1.5;
        }

        /* BUTTONS */

        .button-row {
            display: flex;
            gap: 9px;
        }

        .button {
            flex: 1;
            min-height: 52px;
            padding: 0 16px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px;
            background: rgba(255,255,255,.05);
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: .2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.09);
        }

        .button.primary {
            border: none;
            background:
                linear-gradient(
                    135deg,
                    #ff00cc,
                    #8b5cff
                );
            box-shadow:
                0 8px 30px rgba(255,0,204,.15);
        }

        .button.danger {
            color: #ff719f;
        }

        /* CREATE ROOM */

        .create-room {
            display: none;
            margin-top: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 22px;
            background: rgba(255,255,255,.045);
        }

        .create-room.show {
            display: block;
            animation: appear .25s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .field {
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: rgba(255,255,255,.5);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;
            outline: none;
            background: rgba(0,0,0,.35);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
        }

        .field textarea {
            min-height: 90px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: rgba(139,92,255,.7);
        }

        .field select option {
            background: #111;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0 18px;
            color: rgba(255,255,255,.55);
            font-size: 12px;
        }

        .checkbox-row input {
            accent-color: #8b5cff;
        }

        /* ACCOUNT BUTTONS */

        .account-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 30px;
        }

        .divider {
            height: 1px;
            margin: 10px 0;
            background: rgba(255,255,255,.07);
        }

        /* NAVBAR */

        .bottom-nav {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: min(430px, calc(100% - 30px));
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 22px;
            background: rgba(12,12,18,.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0,0,0,.45);
            z-index: 5000;
        }

        .bottom-nav-button {
            flex: 1;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 17px;
            background: transparent;
            color: rgba(255,255,255,.42);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s ease;
        }

        .bottom-nav-button:hover {
            color: #fff;
            background: rgba(255,255,255,.06);
        }

        .bottom-nav-button.active {
            color: #fff;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,0,204,.22),
                    rgba(139,92,255,.22)
                );
        }

        /* LOADING */

        .loading {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255,255,255,.08);
            border-top-color: #ff00cc;
            border-right-color: #8b5cff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* TOAST */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 95px;
            transform:
                translateX(-50%)
                translateY(20px);
            padding: 13px 18px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            background: rgba(15,15,22,.95);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            opacity: 0;
            visibility: hidden;
            transition: .25s;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform:
                translateX(-50%)
                translateY(0);
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .page {
                padding:
                    55px
                    15px
                    110px;
            }

            .profile-picture {
                width: 95px;
                height: 95px;
                font-size: 40px;
            }

            .username {
                font-size: 24px;
            }

            .stats {
                gap: 8px;
            }

            .bottom-nav {
                bottom: 12px;
                width: calc(100% - 24px);
                height: 60px;
                border-radius: 20px;
            }

            .bottom-nav-button {
                height: 48px;
                border-radius: 15px;
            }

            .button-row {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <main
        id="app"
        class="page"
    >

        <div class="loading">

            <div class="loader"></div>

        </div>

    </main>


    <!-- BOTTOM NAVBAR -->

    <nav class="bottom-nav">

        <button
            class="bottom-nav-button"
            onclick="goHome()"
        >
            Home
        </button>

        <button
            class="bottom-nav-button"
            onclick="goShare()"
        >
            Share
        </button>

        <button
            class="bottom-nav-button active"
            onclick="goAccount()"
        >
            Account
        </button>

    </nav>


    <div
        id="toast"
        class="toast"
    ></div>


    <script>

        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://smfvllbwzbnenjrllfqw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_MKLzWWJG8xkltmNcEL24fg_PCSclHEs";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const app =
            document.getElementById("app");


        /* =====================================================
           INIT
        ===================================================== */

        async function init() {

            try {

                const {
                    data: {
                        user
                    }
                } =
                    await supabaseClient
                        .auth
                        .getUser();


                if (!user) {

                    renderLoggedOut();

                    return;

                }


                await renderAccount(user);

            }

            catch (error) {

                console.error(error);

                renderLoggedOut();

            }

        }


        /* =====================================================
           ACCOUNT
        ===================================================== */

        async function renderAccount(user) {

            const metadata =
                user.user_metadata || {};


            const username =
                metadata.username ||
                metadata.user_name ||
                user.email?.split("@")[0] ||
                "WebTok user";


            const bio =
                metadata.bio ||
                "";


            const avatar =
                username
                    .charAt(0)
                    .toUpperCase();


            const favorites =
                await getFavoritesCount(
                    user.id
                );


            const suggestions =
                await getSuggestionsCount(
                    user.id
                );


            const rooms =
                await getRooms(
                    user.id
                );


            const roomHTML =
                rooms.length
                    ? rooms.map(
                        createRoomHTML
                    ).join("")
                    : createEmptyRoomsHTML();


            app.innerHTML = `

                <div class="container">


                    <!-- PROFILE -->

                    <div class="account-header">

                        <div class="profile-picture">

                            ${escapeHTML(
                                avatar
                            )}

                        </div>


                        <div class="username">

                            @${escapeHTML(
                                username
                            )}

                        </div>


                        <div class="email">

                            ${escapeHTML(
                                user.email || ""
                            )}

                        </div>


                        <div
                            class="bio ${
                                bio.trim()
                                    ? ""
                                    : "empty"
                            }"
                        >

                            ${
                                bio.trim()
                                    ? escapeHTML(bio)
                                    : "No bio yet."
                            }

                        </div>

                    </div>


                    <!-- STATS -->

                    <div class="stats">

                        <div
                            class="stat"
                            onclick="viewFavorites()"
                        >

                            <div class="stat-number">

                                ${favorites}

                            </div>

                            <div class="stat-label">

                                Favorites

                            </div>

                        </div>


                        <div
                            class="stat"
                            onclick="viewSuggestions()"
                        >

                            <div class="stat-number">

                                ${suggestions}

                            </div>

                            <div class="stat-label">

                                Suggestions

                            </div>

                        </div>

                    </div>


                    <!-- ROOMS -->

                    <section class="section">

                        <div class="section-header">

                            <div>

                                <div class="section-title">
                                    Your Rooms
                                </div>

                                <div class="section-subtitle">
                                    Places you've created
                                </div>

                            </div>

                        </div>


                        <div
                            id="rooms"
                            class="rooms"
                        >

                            ${roomHTML}

                        </div>


                        <!-- CREATE ROOM -->

                        <div
                            id="createRoom"
                            class="create-room"
                        >

                            <div class="section-title">
                                Create a room
                            </div>


                            <div
                                class="section-subtitle"
                                style="margin-bottom:20px"
                            >
                                Create a place around an existing
                                game or website.
                            </div>


                            <div class="field">

                                <label>
                                    Room name
                                </label>

                                <input
                                    id="roomName"
                                    type="text"
                                    maxlength="80"
                                    placeholder="My gaming room"
                                >

                            </div>


                            <div class="field">

                                <label>
                                    Description
                                </label>

                                <textarea
                                    id="roomDescription"
                                    maxlength="300"
                                    placeholder="Let's play together..."
                                ></textarea>

                            </div>


                            <div class="field">

                                <label>
                                    Game / Website URL
                                </label>

                                <input
                                    id="roomURL"
                                    type="url"
                                    placeholder="https://example.com"
                                >

                            </div>


                            <div class="field">

                                <label>
                                    Category
                                </label>

                                <select id="roomCategory">

                                    <option value="Game">
                                        Game
                                    </option>

                                    <option value="Website">
                                        Website
                                    </option>

                                    <option value="Quiz">
                                        Quiz
                                    </option>

                                    <option value="Entertainment">
                                        Entertainment
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <label class="checkbox-row">

                                <input
                                    id="roomPublic"
                                    type="checkbox"
                                    checked
                                >

                                <span>
                                    Make this room public
                                </span>

                            </label>


                            <div class="button-row">

                                <button
                                    class="button primary"
                                    onclick="createRoom()"
                                >
                                    Create room
                                </button>


                                <button
                                    class="button"
                                    onclick="toggleCreateRoom()"
                                >
                                    Cancel
                                </button>

                            </div>

                        </div>


                        <div
                            class="button-row"
                            style="margin-top:12px"
                        >

                            <button
                                class="button primary"
                                onclick="toggleCreateRoom()"
                            >
                                Create a room
                            </button>


                            <button
                                class="button"
                                onclick="goShare()"
                            >
                                Find a room
                            </button>

                        </div>

                    </section>


                    <!-- ACCOUNT ACTIONS -->

                    <div class="account-actions">

                        <button
                            class="button primary"
                            onclick="editProfile()"
                        >
                            Edit profile
                        </button>


                        <button
                            class="button"
                            onclick="goSettings()"
                        >
                            Settings
                        </button>


                        <div class="divider"></div>


                        <button
                            class="button danger"
                            onclick="logout()"
                        >
                            Log out
                        </button>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           EMPTY ROOMS
        ===================================================== */

        function createEmptyRoomsHTML() {

            return `

                <div class="empty-rooms">

                    <div class="empty-title">
                        No rooms yet
                    </div>

                    <div class="empty-text">

                        You can find a room in Share
                        or create your own room around
                        a game or website.

                    </div>

                </div>

            `;

        }


        /* =====================================================
           ROOM HTML
        ===================================================== */

        function createRoomHTML(room) {

            return `

                <div
                    class="room"
                    onclick="openRoom(
                        '${escapeAttribute(room.id)}'
                    )"
                >

                    <div class="room-name">

                        ${escapeHTML(
                            room.name
                        )}

                    </div>


                    <div class="room-description">

                        ${
                            room.description
                                ? escapeHTML(
                                    room.description
                                )
                                : "No description."
                        }

                    </div>


                    <div class="room-meta">

                        <span>
                            ${escapeHTML(
                                room.category || "Other"
                            )}
                        </span>

                        <span class="room-dot"></span>

                        <span>
                            ${
                                room.is_public
                                    ? "Public"
                                    : "Private"
                            }
                        </span>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           GET ROOMS
        ===================================================== */

        async function getRooms(userId) {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient

                        .from("rooms")

                        .select("*")

                        .eq(
                            "owner_id",
                            userId
                        )

                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (error) {

                    console.error(
                        "Rooms error:",
                        error
                    );

                    return [];

                }


                return data || [];

            }

            catch (error) {

                console.error(error);

                return [];

            }

        }


        /* =====================================================
           CREATE ROOM
        ===================================================== */

        async function createRoom() {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (!user) {

                showToast(
                    "Please log in first."
                );

                return;

            }


            const name =
                document
                    .getElementById("roomName")
                    .value
                    .trim();


            const description =
                document
                    .getElementById("roomDescription")
                    .value
                    .trim();


            const websiteURL =
                document
                    .getElementById("roomURL")
                    .value
                    .trim();


            const category =
                document
                    .getElementById("roomCategory")
                    .value;


            const isPublic =
                document
                    .getElementById("roomPublic")
                    .checked;


            if (!name) {

                showToast(
                    "Enter a room name."
                );

                return;

            }


            if (!websiteURL) {

                showToast(
                    "Enter a game or website URL."
                );

                return;

            }


            try {

                new URL(websiteURL);

            }

            catch {

                showToast(
                    "Enter a valid URL."
                );

                return;

            }


            const {
                error
            } =
                await supabaseClient

                    .from("rooms")

                    .insert({

                        owner_id:
                            user.id,

                        name:
                            name,

                        description:
                            description,

                        website_url:
                            websiteURL,

                        category:
                            category,

                        is_public:
                            isPublic

                    });


            if (error) {

                console.error(
                    "Create room error:",
                    error
                );

                showToast(
                    "Could not create room."
                );

                return;

            }


            showToast(
                "Room created!"
            );


            await renderAccount(
                user
            );

        }


        /* =====================================================
           TOGGLE CREATE ROOM
        ===================================================== */

        function toggleCreateRoom() {

            const form =
                document.getElementById(
                    "createRoom"
                );


            if (!form) return;


            form.classList.toggle(
                "show"
            );

        }


        /* =====================================================
           OPEN ROOM
        ===================================================== */

        function openRoom(roomId) {

            window.location.href =
                "room.html?id=" +
                encodeURIComponent(
                    roomId
                );

        }


        /* =====================================================
           FAVORITES
        ===================================================== */

        async function getFavoritesCount(
            userId
        ) {

            try {

                const {
                    count,
                    error
                } =
                    await supabaseClient

                        .from("favorites")

                        .select(
                            "*",
                            {
                                count: "exact",
                                head: true
                            }
                        )

                        .eq(
                            "user_id",
                            userId
                        );


                if (error) {

                    console.error(
                        error
                    );

                    return 0;

                }


                return count || 0;

            }

            catch {

                return 0;

            }

        }


        /* =====================================================
           SUGGESTIONS
        ===================================================== */

        async function getSuggestionsCount(
            userId
        ) {

            try {

                const {
                    count,
                    error
                } =
                    await supabaseClient

                        .from(
                            "website_suggestions"
                        )

                        .select(
                            "*",
                            {
                                count: "exact",
                                head: true
                            }
                        )

                        .eq(
                            "suggested_by",
                            userId
                        );


                if (error) {

                    console.error(
                        error
                    );

                    return 0;

                }


                return count || 0;

            }

            catch {

                return 0;

            }

        }


        /* =====================================================
           LOGGED OUT
        ===================================================== */

        function renderLoggedOut() {

            app.innerHTML = `

                <div class="container">

                    <div class="empty-rooms">

                        <div class="profile-picture">
                            W
                        </div>

                        <div class="empty-title">
                            Welcome to WebTok
                        </div>

                        <div class="empty-text">

                            Log in or create an account
                            to create rooms, save favorites
                            and explore the WebTok community.

                        </div>


                        <div class="button-row">

                            <button
                                class="button primary"
                                onclick="goLogin()"
                            >
                                Log in
                            </button>


                            <button
                                class="button"
                                onclick="goSignup()"
                            >
                                Sign up
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        async function logout() {

            const {
                error
            } =
                await supabaseClient
                    .auth
                    .signOut();


            if (error) {

                showToast(
                    "Could not log out."
                );

                return;

            }


            window.location.href =
                "main.html";

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        function goHome() {

            window.location.href =
                "main.html";

        }


        function goShare() {

            window.location.href =
                "share.html";

        }


        function goAccount() {

            window.location.href =
                "account.html";

        }

        function goSignup() {

        function viewFavorites() {

        }


        function viewSuggestions() {

            window.location.href =
                "suggestions.html";

        }


        function editProfile() {

            window.location.href =
                "profile.html";

        }


        function goSettings() {

            window.location.href =
                "settings.html";

        }


        /* =====================================================
           TOAST
        ===================================================== */

        function showToast(message) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.classList.add(
                "show"
            );


            setTimeout(
                () => {

                    toast.classList.remove(
                        "show"
                    );

                },
                2500
            );

        }


        /* =====================================================
           SECURITY
        ===================================================== */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeAttribute(value) {

            return String(value)
                .replace(
                    /'/g,
                    "\\'"
                )
                .replace(
                    /\\/g,
                    "\\\\"
                );

        }


        /* =====================================================
           START
        ===================================================== */

        init();

    </script>
