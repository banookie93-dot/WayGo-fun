<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelWay</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Manrope', sans-serif;

            background: #0d0702;

            color: white;
        }


        /* =========================================
           BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #4a2000 0%,
                    #241000 30%,
                    #0d0702 65%,
                    #030201 100%
                );
        }


        /* Oranžová žiara */

        .glow {
            position: absolute;

            width: 430px;
            height: 430px;

            left: 50%;
            top: 48%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: #ff7a00;

            filter: blur(155px);

            opacity: .13;
        }


        /* Druhá slabšia žiara */

        .glow-small {
            position: absolute;

            width: 180px;
            height: 180px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: #ff9d32;

            filter: blur(90px);

            opacity: .12;
        }


        /* =========================================
           HORIZONT
        ========================================= */

        .horizon {
            position: absolute;

            left: -10%;
            right: -10%;

            bottom: 28%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,145,50,.25),
                    transparent
                );

            box-shadow:
                0 0 25px rgba(255,115,0,.15);
        }


        /* =========================================
           TRASA / CESTA
        ========================================= */

        .route {
            position: absolute;

            width: 420px;
            height: 170px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                rotate(-8deg);

            border-top:
                1px dashed rgba(255,151,54,.13);

            border-radius: 50%;
        }


        .route::before {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #ff8a19;

            box-shadow:
                0 0 10px #ff8a19,
                0 0 25px rgba(255,138,25,.7);

            right: 35px;
            top: -3px;
        }


        /* =========================================
           MALÉ BODY / SVETLÁ
        ========================================= */

        .lights {
            position: absolute;

            inset: 0;
        }


        .light {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #ff9b3d;

            box-shadow:
                0 0 12px #ff8a19;

            opacity: .35;

            animation:
                blink 3s ease-in-out infinite;
        }


        .light:nth-child(1) {
            left: 18%;
            top: 31%;
        }

        .light:nth-child(2) {
            left: 78%;
            top: 28%;
            animation-delay: .8s;
        }

        .light:nth-child(3) {
            left: 12%;
            top: 68%;
            animation-delay: 1.4s;
        }

        .light:nth-child(4) {
            left: 84%;
            top: 72%;
            animation-delay: 2s;
        }


        @keyframes blink {

            0%,
            100% {
                opacity: .15;
            }

            50% {
                opacity: .7;
            }
        }


        /* =========================================
           CONTENT
        ========================================= */

        .content {
            position: relative;

            z-index: 5;

            display: flex;
            flex-direction: column;

            align-items: center;

            text-align: center;

            animation:
                appear 1.1s ease forwards;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {
            font-size: clamp(52px, 11vw, 115px);

            font-weight: 700;

            letter-spacing: -6px;

            line-height: 1;

            color: white;

            text-shadow:
                0 0 20px rgba(255,137,25,.35),
                0 0 60px rgba(255,106,0,.18);
        }


        .logo span {
            color: #ff8a19;

            text-shadow:
                0 0 18px rgba(255,138,25,.6);
        }


        /* =========================================
           POD LOGOM
        ========================================= */

        .line {
            position: relative;

            width: 55px;
            height: 1px;

            margin-top: 25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff8a19,
                    transparent
                );

            box-shadow:
                0 0 15px #ff8a19;

            animation:
                lineAppear 1.4s ease forwards;
        }


        .line::after {
            content: "";

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #ff8a19;

            box-shadow:
                0 0 12px #ff8a19;

            right: 7px;
            top: -2px;
        }


        .text {
            margin-top: 18px;

            color: rgba(255,255,255,.3);

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 5px;

            text-transform: uppercase;
        }


        /* =========================================
           ANIMÁCIE
        ========================================= */

        @keyframes appear {

            0% {
                opacity: 0;

                transform:
                    scale(.96)
                    translateY(8px);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        @keyframes lineAppear {

            0% {
                width: 0;
                opacity: 0;
            }

            100% {
                width: 55px;
                opacity: 1;
            }
        }


        /* =========================================
           3 SEKUNDY → MAIN
        ========================================= */

        body {
            animation:
                pageOut .7s ease 2.3s forwards;
        }


        @keyframes pageOut {

            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }


        /* =========================================
           MOBIL
        ========================================= */

        @media (max-width: 500px) {

            .glow {
                width: 300px;
                height: 300px;

                filter: blur(120px);
            }

            .glow-small {
                width: 130px;
                height: 130px;
            }

            .route {
                width: 300px;
            }

            .logo {
                letter-spacing: -4px;
            }

            .text {
                font-size: 7px;
                letter-spacing: 4px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         POZADIE
    ========================================= -->

    <div class="background">

        <div class="glow"></div>

        <div class="glow-small"></div>

        <div class="horizon"></div>

        <div class="route"></div>

        <div class="lights">
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
        </div>

    </div>


    <!-- =========================================
         LOGO
    ========================================= -->

    <main class="content">

        <div class="logo">
            Travel<span>Way</span>
        </div>

        <div class="line"></div>

        <div class="text">
            Explore · Discover · Go
        </div>

    </main>


    <!-- =========================================
         PRESUN NA MAIN
    ========================================= -->

    <script>

        setTimeout(() => {

            window.location.href = "mainT.html";

        }, 3000);

    </script>


</body>
</html>
