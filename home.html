<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>webtok</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #24104d 0%,
                    #090014 35%,
                    #000 75%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            animation: pageAppear 1s ease;
        }


        /* =========================================
           NEON BACKGROUND
        ========================================= */

        body::before,
        body::after {

            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.45;

            pointer-events: none;

            animation:
                floatingGlow 6s ease-in-out infinite alternate;
        }


        body::before {

            background: #ff00cc;

            top: -180px;
            left: -180px;
        }


        body::after {

            background: #00eaff;

            bottom: -180px;
            right: -180px;

            animation-delay: 1s;
        }


        /* =========================================
           PARTICLES
        ========================================= */

        .particle {

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 8px white,
                0 0 18px #ff00cc;

            pointer-events: none;

            animation:
                particleFloat 4s linear infinite;
        }


        .p1 {
            left: 15%;
            top: 30%;
        }

        .p2 {
            left: 80%;
            top: 20%;
            animation-delay: 1s;
        }

        .p3 {
            left: 25%;
            top: 75%;
            animation-delay: 2s;
        }

        .p4 {
            left: 70%;
            top: 70%;
            animation-delay: 0.5s;
        }

        .p5 {
            left: 50%;
            top: 15%;
            animation-delay: 1.5s;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .container {

            position: relative;

            z-index: 5;

            text-align: center;

            animation:
                contentEntrance
                1.2s
                cubic-bezier(.17,.67,.3,1.3);
        }


        /* =========================================
           W LOGO
        ========================================= */

        .logo {

            font-size: 190px;

            font-weight: 1000;

            line-height: 0.8;

            background:

                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #ff4fd8 35%,
                    #8b5cff 65%,
                    #00eaff 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            filter:

                drop-shadow(0 0 12px #ff00cc)
                drop-shadow(0 0 35px #8b5cff)
                drop-shadow(0 0 65px #00eaff);

            animation:
                logoPulse 2.5s ease-in-out infinite;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {

            margin-top: 55px;

            display: flex;

            flex-direction: column;

            gap: 18px;

            width: 260px;

            animation:
                buttonsAppear
                1.5s
                ease;
        }


        button {

            width: 100%;

            height: 58px;

            border-radius: 18px;

            font-size: 18px;

            font-weight: 800;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* LOGIN */

        .login {

            background:
                rgba(255,255,255,0.08);

            color: white;

            border:
                1px solid
                rgba(255,255,255,0.25);

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 0 15px
                rgba(139,92,255,0.3);
        }


        /* SIGN UP */

        .signup {

            background:

                linear-gradient(
                    135deg,
                    #ff00cc,
                    #8b5cff,
                    #00eaff
                );

            color: white;

            border: none;

            box-shadow:

                0 0 15px #ff00cc,
                0 0 35px
                rgba(139,92,255,0.5);
        }


        /* =========================================
           BUTTON HOVER
        ========================================= */

        button:hover {

            transform:
                scale(1.06)
                translateY(-3px);
        }


        .login:hover {

            box-shadow:

                0 0 20px #8b5cff,
                0 0 45px
                rgba(0,234,255,0.4);
        }


        .signup:hover {

            box-shadow:

                0 0 25px #ff00cc,
                0 0 55px #8b5cff;
        }


        button:active {

            transform:
                scale(0.95);
        }


        /* =========================================
           SHINE EFFECT
        ========================================= */

        button::after {

            content: "";

            position: absolute;

            top: 0;

            left: -120%;

            width: 70%;

            height: 100%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.4),
                    transparent
                );

            transform:
                skewX(-20deg);

            animation:
                buttonShine
                3.5s
                infinite;
        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes pageAppear {

            from {

                opacity: 0;

            }

            to {

                opacity: 1;

            }
        }


        @keyframes contentEntrance {

            0% {

                opacity: 0;

                transform:
                    scale(0.5)
                    translateY(30px);

                filter:
                    blur(15px);
            }

            70% {

                transform:
                    scale(1.05);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1);

                filter:
                    blur(0);
            }
        }


        @keyframes buttonsAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes logoPulse {

            0%,
            100% {

                transform:
                    scale(1);
            }

            50% {

                transform:
                    scale(1.05);
            }
        }


        @keyframes floatingGlow {

            from {

                transform:
                    translate(0,0)
                    scale(1);
            }

            to {

                transform:
                    translate(80px,50px)
                    scale(1.3);
            }
        }


        @keyframes particleFloat {

            0% {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.5);
            }

            30% {

                opacity: 1;
            }

            100% {

                opacity: 0;

                transform:
                    translateY(-120px)
                    scale(1.5);
            }
        }


        @keyframes buttonShine {

            0% {

                left: -120%;
            }

            25% {

                left: 150%;
            }

            100% {

                left: 150%;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            .logo {

                font-size: 150px;
            }

            .buttons {

                width: 230px;
            }

        }

    </style>

</head>


<body>


    <!-- PARTICLES -->

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>


    <!-- CONTENT -->

    <div class="container">

        <div class="logo">
            W
        </div>


        <div class="buttons">

            <button
                class="login"
                onclick="window.location.href='login.html'">

                Login

            </button>


            <button
                class="signup"
                onclick="window.location.href='signup.html'">

                Sign Up

            </button>

        </div>

    </div>


</body>
</html>
