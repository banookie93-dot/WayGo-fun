<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduFlow</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Manrope', sans-serif;

            background: #08000f;

            color: white;
        }


        /* =========================================
           POZADIE
        ========================================= */

        .background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    #28004d 0%,
                    #130021 35%,
                    #08000f 70%,
                    #030006 100%
                );
        }


        /* Jemná fialová žiara */

        .glow {
            position: absolute;

            width: 420px;
            height: 420px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: #8b35ff;

            filter: blur(150px);

            opacity: .14;
        }


        /* Jemný svetelný kruh */

        .ring {
            position: absolute;

            width: 300px;
            height: 300px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            border: 1px solid rgba(176, 105, 255, .08);

            box-shadow:
                0 0 80px rgba(139,53,255,.06);
        }


        /* =========================================
           LOGO
        ========================================= */

        .content {
            position: relative;

            z-index: 5;

            display: flex;
            flex-direction: column;

            align-items: center;

            text-align: center;

            animation:
                appear 1.2s ease forwards;
        }


        .logo {
            font-size: clamp(60px, 13vw, 125px);

            font-weight: 700;

            letter-spacing: -6px;

            line-height: 1;

            color: white;

            text-shadow:
                0 0 20px rgba(175,105,255,.35),
                0 0 60px rgba(139,53,255,.2);
        }


        .line {
            width: 45px;
            height: 1px;

            margin-top: 25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #a85cff,
                    transparent
                );

            box-shadow:
                0 0 15px #8b35ff;

            animation:
                lineAppear 1.5s ease forwards;
        }


        .text {
            margin-top: 18px;

            color: rgba(255,255,255,.3);

            font-size: 9px;

            font-weight: 500;

            letter-spacing: 5px;

            text-transform: uppercase;
        }


        /* =========================================
           ANIMÁCIE
        ========================================= */

        @keyframes appear {

            0% {
                opacity: 0;
                transform: scale(.96);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }


        @keyframes lineAppear {

            0% {
                width: 0;
                opacity: 0;
            }

            100% {
                width: 45px;
                opacity: 1;
            }
        }


        /* =========================================
           3 SEKUNDY → MAIN
        ========================================= */

        body {
            animation:
                pageOut .7s ease 2.3s forwards;
        }


        @keyframes pageOut {

            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }


        /* =========================================
           MOBIL
        ========================================= */

        @media (max-width: 500px) {

            .glow {
                width: 300px;
                height: 300px;

                filter: blur(120px);
            }

            .ring {
                width: 230px;
                height: 230px;
            }

            .logo {
                letter-spacing: -4px;
            }

            .text {
                font-size: 7px;
                letter-spacing: 4px;
            }
        }

    </style>
</head>


<body>


    <div class="background">

        <div class="glow"></div>

        <div class="ring"></div>

    </div>


    <main class="content">

        <div class="logo">
            EduFlow
        </div>

        <div class="line"></div>

        <div class="text">
            Learn · Create · Grow
        </div>

    </main>


    <script>

        /*
         * Po 3 sekundách otvorí mainE.html
         */

        setTimeout(() => {

            window.location.href = "mainE.html";

        }, 3000);

    </script>


</body>
</html>
